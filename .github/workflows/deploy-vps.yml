name: Deploy Frontend to VPS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout Code
      - name: Checkout code
        uses: actions/checkout@v6.0.2
      
      # 2. Create .env file for build
      - name: Create .env file
        run: |
          echo "NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}" > .env
          echo "NEXT_PUBLIC_ML_SERVICE_URL=${{ secrets.NEXT_PUBLIC_ML_SERVICE_URL }}" >> .env
          echo "NEXT_PUBLIC_ML_SERVICE_SECRET_KEY=${{ secrets.NEXT_PUBLIC_ML_SERVICE_SECRET_KEY }}" >> .env
      
      # 3. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Build & Push Image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/hireon-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/hireon-frontend:${{ github.sha }}

      # 5. Deploy to VPS
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            # Pull latest image
            docker pull ${{ secrets.DOCKER_USERNAME }}/hireon-frontend:latest
            
            # Stop and remove old container
            docker stop hireon-frontend || true
            docker rm hireon-frontend || true
            
            # Run new container
            docker run -d \
              --name hireon-frontend \
              --restart unless-stopped \
              -p 3000:3000 \
              -e NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }} \
              -e NEXT_PUBLIC_ML_SERVICE_URL=${{ secrets.NEXT_PUBLIC_ML_SERVICE_URL }} \
              -e NEXT_PUBLIC_ML_SERVICE_SECRET_KEY=${{ secrets.NEXT_PUBLIC_ML_SERVICE_SECRET_KEY }} \
              -e NODE_ENV=production \
              ${{ secrets.DOCKER_USERNAME }}/hireon-frontend:latest
            
            # Clean up old images
            docker image prune -af --filter "until=24h"
            
            # Show container status
            docker ps | grep hireon-frontend

      # 6. Verify Deployment
      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            # Wait for container to be healthy
            sleep 10
            
            # Check if container is running
            if docker ps | grep -q hireon-frontend; then
              echo "✅ Container is running"
              docker logs --tail 20 hireon-frontend
            else
              echo "❌ Container failed to start"
              docker logs --tail 50 hireon-frontend
              exit 1
            fi
